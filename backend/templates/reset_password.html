<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EVraahein · Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7faf8;
      --panel: #ffffff;
      --text: #122118;
      --muted: #5a6b61;
      --line: #dce7df;
      --brand: #15803d;
      --brand-dark: #166534;
      --danger: #b91c1c;
      --ok: #047857;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(21, 128, 61, .12), rgba(14, 165, 233, .10)),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 420px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, .12);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      font-weight: 800;
      color: var(--brand);
      font-size: 20px;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--brand);
      color: white;
      font-weight: 900;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.5;
    }
    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
      font-weight: 700;
    }
    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font: inherit;
      outline: none;
    }
    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(21, 128, 61, .14);
    }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 22px;
      border: 0;
      border-radius: 8px;
      background: var(--brand);
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: var(--brand-dark); }
    button:disabled { cursor: wait; opacity: .65; }
    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.45;
    }
    .message.error {
      display: block;
      color: var(--danger);
      background: #fef2f2;
      border: 1px solid #fecaca;
    }
    .message.success {
      display: block;
      color: var(--ok);
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">E</span><span>EVraahein</span></div>
    <h1>Reset Password</h1>
    <p>Enter a new password for your account. This link can only be used once.</p>

    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="6" required />

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required />

      <button id="submitButton" type="submit">Update Password</button>
      <div id="message" class="message" role="status"></div>
    </form>
  </main>

  <script>
    const supabaseUrl = '__SUPABASE_URL__';
    const supabaseAnonKey = '__SUPABASE_ANON_KEY__';
    const client = window.supabase.createClient(supabaseUrl, supabaseAnonKey, {
      auth: {
        detectSessionInUrl: true,
        flowType: 'implicit',
        persistSession: false,
      },
    });

    const form = document.getElementById('resetForm');
    const button = document.getElementById('submitButton');
    const message = document.getElementById('message');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + type;
    }

    async function ensureRecoverySession() {
      const params = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');

      if (accessToken && refreshToken) {
        const { error } = await client.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken,
        });
        if (error) throw error;
        history.replaceState(null, document.title, window.location.pathname);
        return;
      }

      const { data, error } = await client.auth.getSession();
      if (error) throw error;
      if (!data.session) {
        throw new Error('This reset link is invalid or expired. Please request a new password reset email.');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password.length < 6) {
        showMessage('Password must be at least 6 characters.', 'error');
        return;
      }
      if (password !== confirmPassword) {
        showMessage('Passwords do not match.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Updating...';

      try {
        await ensureRecoverySession();
        const { error } = await client.auth.updateUser({ password });
        if (error) throw error;
        showMessage('Password updated. You can now return to the app or admin dashboard and sign in.', 'success');
        form.reset();
      } catch (error) {
        showMessage(error.message || 'Password reset failed. Please request a fresh reset link.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
