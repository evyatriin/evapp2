<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog – EVraahein</title>
  <meta name="description" content="Insights on EV routing, charging infrastructure, and the future of electric mobility in India." />
  <link rel="icon" type="image/png" href="../app_icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --cyan: #00e5ff; --green: #00e676; --dark: #060d1b; --border: rgba(0,229,255,0.12); }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--dark); color: #d0e8f4; min-height: 100vh; }
    .glow { position: fixed; top: -20%; left: 50%; transform: translateX(-50%); width: 900px; height: 500px; background: radial-gradient(ellipse, rgba(0,229,255,0.07) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    .wrapper { position: relative; z-index: 1; max-width: 1060px; margin: 0 auto; padding: 0 24px 80px; }

    /* Nav */
    nav { display: flex; align-items: center; justify-content: space-between; padding: 24px 0; border-bottom: 1px solid var(--border); margin-bottom: 56px; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo img { width: 36px; height: 36px; border-radius: 10px; box-shadow: 0 0 16px rgba(0,229,255,0.35); object-fit: cover; }
    .logo-text { font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 900; background: linear-gradient(90deg, var(--cyan), var(--green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav-right { display: flex; align-items: center; gap: 24px; }
    .nav-right a { font-size: 0.82rem; color: rgba(255,255,255,0.4); text-decoration: none; transition: color 0.2s; }
    .nav-right a:hover { color: var(--cyan); }
    .nav-right a.active { color: var(--cyan); }

    /* Header */
    .page-header { margin-bottom: 52px; }
    .page-tag { display: inline-block; font-size: 0.68rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--cyan); background: rgba(0,229,255,0.08); border: 1px solid rgba(0,229,255,0.16); padding: 4px 14px; border-radius: 100px; margin-bottom: 16px; }
    h1 { font-family: 'Outfit', sans-serif; font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 800; color: #fff; letter-spacing: -0.8px; margin-bottom: 10px; }
    .header-sub { font-size: 0.95rem; color: rgba(208,232,244,0.5); }

    /* Grid */
    .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

    /* Card */
    .post-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 14px; transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s; text-decoration: none; color: inherit; }
    .post-card:hover { transform: translateY(-5px); border-color: rgba(0,229,255,0.3); box-shadow: 0 16px 44px rgba(0,229,255,0.06); }
    .card-meta { display: flex; align-items: center; gap: 10px; }
    .card-category { font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 3px 10px; border-radius: 100px; }
    .cat-product { color: var(--cyan); background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.18); }
    .cat-industry { color: #a78bfa; background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.18); }
    .cat-technology { color: var(--green); background: rgba(0,230,118,0.1); border: 1px solid rgba(0,230,118,0.18); }
    .card-date { font-size: 0.73rem; color: rgba(255,255,255,0.28); }
    .card-title { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 700; color: #fff; line-height: 1.35; }
    .card-excerpt { font-size: 0.86rem; color: rgba(208,232,244,0.55); line-height: 1.65; flex: 1; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.05); }
    .card-readtime { font-size: 0.73rem; color: rgba(255,255,255,0.28); }
    .card-arrow { font-size: 0.9rem; color: var(--cyan); transition: transform 0.2s; }
    .post-card:hover .card-arrow { transform: translateX(4px); }

    /* Loading / error */
    .state-msg { text-align: center; padding: 80px 20px; color: rgba(255,255,255,0.3); font-size: 0.9rem; }

    /* Footer */
    footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .footer-brand { font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 800; background: linear-gradient(90deg, var(--cyan), var(--green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .footer-note { font-size: 0.73rem; color: rgba(255,255,255,0.22); }

    @media (max-width: 560px) { nav { flex-wrap: wrap; gap: 12px; } .nav-right { gap: 14px; } }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrapper">

    <nav>
      <a href="../index.html" class="logo">
        <img src="../app_icon.png" alt="EVraahein" onerror="this.style.display='none';" />
        <span class="logo-text">EVraahein</span>
      </a>
      <div class="nav-right">
        <a href="../index.html">Home</a>
        <a href="../terms.html">Terms</a>
        <a href="../privacy.html">Privacy</a>
        <a href="index.html" class="active">Blog</a>
      </div>
    </nav>

    <div class="page-header">
      <span class="page-tag">From the team</span>
      <h1>EVraahein Blog</h1>
      <p class="header-sub">Insights on EV routing, charging infrastructure, and electric mobility in India.</p>
    </div>

    <div id="posts-grid" class="posts-grid">
      <div class="state-msg">Loading posts…</div>
    </div>

    <footer>
      <div>
        <span class="footer-brand">EVraahein</span>
        <span class="footer-note" style="display:block;margin-top:2px;">TaruniLakshmi Ventures · Hyderabad</span>
      </div>
      <a href="mailto:hey@evraahein.app" style="font-size:0.73rem;color:var(--cyan);text-decoration:none;">hey@evraahein.app</a>
    </footer>

  </div>

  <script>
    const CATEGORY_CLASS = { Product: 'cat-product', Industry: 'cat-industry', Technology: 'cat-technology' };

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    async function loadPosts() {
      const grid = document.getElementById('posts-grid');
      try {
        const res = await fetch('manifest.json');
        if (!res.ok) throw new Error('Manifest not found');
        const posts = await res.json();

        if (!posts.length) {
          grid.innerHTML = '<div class="state-msg">No posts yet. Check back soon.</div>';
          return;
        }

        grid.innerHTML = posts.map(p => `
          <a class="post-card" href="post.html?slug=${encodeURIComponent(p.slug)}">
            <div class="card-meta">
              <span class="card-category ${CATEGORY_CLASS[p.category] || 'cat-product'}">${p.category}</span>
              <span class="card-date">${formatDate(p.date)}</span>
            </div>
            <div class="card-title">${p.title}</div>
            <div class="card-excerpt">${p.excerpt}</div>
            <div class="card-footer">
              <span class="card-readtime">⏱ ${p.readTime}</span>
              <span class="card-arrow">→</span>
            </div>
          </a>
        `).join('');
      } catch (err) {
        grid.innerHTML = `<div class="state-msg">Could not load posts. <a href="mailto:hey@evraahein.app" style="color:var(--cyan)">hey@evraahein.app</a></div>`;
      }
    }

    loadPosts();
  </script>
</body>
</html>
